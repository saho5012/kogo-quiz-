<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>古語クイズ🐒</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN',sans-serif;background:#FDF5EC;min-height:100vh;color:#3D2B1F;max-width:480px;margin:0 auto}
.screen{display:none;padding:20px;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* タイトル画面 */
#s-title{align-items:center;justify-content:center;text-align:center;gap:16px}
.title-icon{font-size:72px;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title-text{font-size:28px;font-weight:900;color:#8B4513;letter-spacing:2px}
.title-sub{font-size:14px;color:#A0714F;margin-top:-8px}
.mode-label{font-size:13px;color:#A0714F;margin-top:8px;font-weight:700;letter-spacing:1px}
.btn{width:100%;padding:16px;border:none;border-radius:20px;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-primary{background:#C67B46;color:#fff;box-shadow:0 4px 0 #8B4513}
.btn-primary:active{box-shadow:none;transform:translateY(4px)}
.btn-green{background:#6BBF6B;color:#fff;box-shadow:0 4px 0 #4A9A4A}
.btn-green:active{box-shadow:none;transform:translateY(4px)}
.btn-wrong{background:#E8A87C;color:#fff;box-shadow:0 4px 0 #C67B46}
.btn-wrong:active{box-shadow:none;transform:translateY(4px)}
.wrong-count{font-size:12px;opacity:.85}

/* クイズ画面 */
#s-quiz{gap:12px}
.progress-bar{width:100%;height:8px;background:#E8D5C4;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#C67B46,#E8A87C);border-radius:4px;transition:width .4s}
.status-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#A0714F}
.streak{color:#FF6B35;font-weight:900;font-size:15px}
.q-card{background:#FFFAF4;border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(139,69,19,.1);line-height:2;font-size:17px}
.q-card u{text-decoration:underline;text-decoration-color:#C67B46;text-decoration-thickness:2px;font-weight:700;color:#8B4513}
.source-tag{font-size:12px;color:#A0714F;background:#F0E6D6;padding:2px 10px;border-radius:20px;display:inline-block;margin-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.choice-btn{background:#FFFAF4;border:2.5px solid #E8D5C4;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;color:#3D2B1F;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;line-height:1.4}
.choice-btn:active{transform:scale(.95)}
.choice-btn.correct{background:#D4F5D4;border-color:#6BBF6B;color:#2D7A2D}
.choice-btn.wrong{background:#FFD4D4;border-color:#FF6B6B;color:#B00}
.choice-btn.disabled{pointer-events:none;opacity:.5}
.choice-btn.show-correct{background:#D4F5D4;border-color:#6BBF6B;color:#2D7A2D}

/* 答え画面 */
#s-answer{gap:14px}
.result-badge{text-align:center;font-size:48px;padding:10px 0}
.result-text{text-align:center;font-size:20px;font-weight:900}
.result-text.ok{color:#2D7A2D}
.result-text.ng{color:#CC0000}
.ans-card{background:#FFFAF4;border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(139,69,19,.1);line-height:2;font-size:16px}
.ans-card .ans-highlight{color:#CC0000;text-decoration:underline;text-decoration-color:#CC0000;text-decoration-thickness:2px;font-weight:700}
.ans-label{font-size:12px;color:#A0714F;font-weight:700;margin-bottom:4px}
.next-btn{margin-top:auto}

/* 結果画面 */
#s-result{align-items:center;justify-content:center;text-align:center;gap:16px}
.big-score{font-size:64px;font-weight:900;color:#8B4513}
.score-msg{font-size:18px;color:#A0714F}
.result-detail{background:#FFFAF4;border-radius:20px;padding:16px 24px;width:100%;box-shadow:0 2px 12px rgba(139,69,19,.1)}
.result-row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid #F0E6D6}
.result-row:last-child{border:none}

ruby{ruby-align:center}
rt{font-size:10px;color:#A0714F}
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="s-title" class="screen active">
  <div class="title-icon">🐒</div>
  <div class="title-text">古語クイズ</div>
  <div class="title-sub">棒線部の意味を選ぼう！</div>
  <div style="height:8px"></div>
  <div class="mode-label">📚 モードを選んでね</div>
  <button class="btn btn-primary" onclick="startQuiz('casual')">⚡ お気軽15問モード</button>
  <button class="btn btn-green" onclick="startQuiz('all')">📖 全問チャレンジモード</button>
  <button class="btn btn-wrong" id="btn-wrong" onclick="startQuiz('wrong')">
    ❌ 間違い直しモード<br><span class="wrong-count" id="wrong-count-label"></span>
  </button>
</div>

<!-- クイズ画面 -->
<div id="s-quiz" class="screen">
  <div class="status-row">
    <span id="q-counter">1 / 15</span>
    <span>🏆 <span id="score-disp">0</span>点</span>
    <span class="streak" id="streak-disp"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="q-card">
    <div id="q-sentence"></div>
    <div style="margin-top:6px"><span class="source-tag" id="q-source"></span></div>
  </div>
  <div class="choices" id="choices"></div>
</div>

<!-- 答え画面 -->
<div id="s-answer" class="screen">
  <div class="result-badge" id="ans-badge"></div>
  <div class="result-text" id="ans-result-text"></div>
  <div>
    <div class="ans-label">📜 原文</div>
    <div class="ans-card" id="ans-sentence"></div>
  </div>
  <div>
    <div class="ans-label">💡 現代語訳</div>
    <div class="ans-card" id="ans-translation"></div>
  </div>
  <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
</div>

<!-- 結果画面 -->
<div id="s-result" class="screen">
  <div class="title-icon">🏆</div>
  <div class="big-score" id="final-score"></div>
  <div class="score-msg" id="final-msg"></div>
  <div class="result-detail">
    <div class="result-row"><span>正解数</span><span id="res-correct"></span></div>
    <div class="result-row"><span>不正解数</span><span id="res-wrong"></span></div>
    <div class="result-row"><span>最大連続正解</span><span id="res-streak"></span></div>
  </div>
  <button class="btn btn-primary" onclick="showTitle()" style="width:100%">🏠 タイトルに戻る</button>
  <button class="btn btn-wrong" onclick="startQuiz('wrong')" style="width:100%" id="res-wrong-btn"></button>
</div>

<script>
const Q = [
  // あはれなり
  {w:'あはれなり',s:'月のいと明かきおもてに薄き雲、[[あはれなり]]。',src:'枕',t:'月のたいそう明るい面に薄き雲（がかかって）いるのは、[[しみじみと趣深い]]。',a:'しみじみと趣深い'},
  {w:'あはれなり',s:'中納言悩みて失せぬ。いといとほしう[[あはれなり]]。',src:'増鏡',t:'中納言が病気になって亡くなった。たいそう気の毒で[[しみじみと悲しい]]。',a:'しみじみと悲しい'},
  // おろかなり
  {w:'おろかなり',s:'帝の御使ひを、いかでか[[おろか]]にせむ。',src:'竹取',t:'帝のご使者を、どうして[[おろそかに]]もてなそうか、いやしない。',a:'おろそかに'},
  {w:'おろかなり',s:'至りて[[おろかなる]]人は、たまたま賢なる人を見て、これを憎む。',src:'徒然',t:'きわめて[[愚かな]]人は、たまたま賢い人に会うと、この人を憎む。',a:'愚かな'},
  // をこなり
  {w:'をこなり',s:'<ruby>君達<rt>きみだち</rt></ruby>は<ruby>元輔<rt>もとすけ</rt></ruby>がこの馬から落ちて、冠落としたるを[[をこなり]]とや思ひ給ふ。',src:'今昔',t:'あなた方は元輔がこの馬から落ちて、冠を落としたのを[[愚かだ]]と思いなさるのか。',a:'愚かだ'},
  // あてなり
  {w:'あてなり',s:'[[あてなる]]女の尼になりて、世の中を思ひんじて、京にもあらず、はるかなる山里に住みけり。',src:'伊勢',t:'[[高貴な]]女が尼になって、世の中をいやに思って、京にもいず、はるか遠い山里に住んだ。',a:'高貴な'},
  {w:'あてなり',s:'髪のかかり給へるそば目、言ひ知らず[[あて]]にらうたげなり。',src:'源氏',t:'髪がおかかりになっている横顔は、言いようもなく[[上品で]]かわいらしい様子である。',a:'上品で'},
  // あながちなり
  {w:'あながちなり',s:'桜の散らんは、[[あながちに]]いかがせん、苦しからず。',src:'宇治',t:'桜が散ることは、[[強引に]]どうにかすることもできないので、さしつかえない。',a:'強引に'},
  {w:'あながちなり',s:'春宮の女御は、[[あながちなり]]と憎み聞こえ給ふ。',src:'源氏',t:'春宮の女御は、[[度が過ぎている]]と非難申し上げなさる。',a:'度が過ぎている'},
  {w:'あながちなり',s:'盗人といふ者、[[あながちに]]外より来たりて物を取るばかりにはあらず。',src:'浮世',t:'盗人という者は、[[必ずしも]]外から来て物を取るだけではない。',a:'必ずしも'},
  {w:'あながちなり',s:'この人々、[[あながちに]]こころざし見えありく。',src:'竹取',t:'この人々は、[[むやみに]]愛情を見せて回る。',a:'むやみに'},
  // せちなり
  {w:'せちなり',s:'七月十五日の月にいでゐて、[[せちに]]物思へるけしきなり。',src:'竹取',t:'七月十五日の月に（縁側に）出て座って、[[切実に]]物思いをしている様子である。',a:'切実に'},
  {w:'せちなり',s:'大納言、宰相もろともに、しのびてものし給へ。[[せちなる]]ことと聞こえむ。',src:'宇津保',t:'大納言や、宰相と一緒に、こっそりお越しください。[[大切な]]ことを申し上げよう。',a:'大切な'},
  // いたづらなり
  {w:'いたづらなり',s:'この庭の[[いたづらに]]広きこと、あさましく、あるべからぬことなり。',src:'徒然',t:'この庭が[[無駄で]]広いことは、あきれたことで、あってはならないことだ。',a:'無駄で'},
  {w:'いたづらなり',s:'船も出ださで[[いたづらなれば]]、ある人の詠める',src:'土佐',t:'船も出さないで[[ひまなので]]、ある人が詠んだ',a:'ひまなので'},
  // みそかなり
  {w:'みそかなり',s:'親しき人のもとへ行き通ひけるほどに、娘を思ひかけて、[[みそかに]]通ひありきけり。',src:'堤',t:'（男が）親しい人のもとに通っていたうちに、娘に恋をして、[[ひそかに]]通い続けていた。',a:'ひそかに'},
  // つれづれなり
  {w:'つれづれなり',s:'雨いたう降りて[[つれづれなり]]とて、殿上人、上の御局に召して御遊びあり。',src:'枕',t:'雨がひどく降って[[退屈だ]]と言って、殿上人を、中宮のお部屋にお呼びになり管弦の宴がある。',a:'退屈だ'},
  {w:'つれづれなり',s:'そこはかとなく[[つれづれに]]心細うのみ覚ゆるを、',src:'源氏',t:'何となく[[物寂しく]]、心細いとばかり思われるのを、',a:'物寂しく'},
  // おもかげ

  {w:'おもかげ',s:'虎つづまりゐて、物をうかがふ。その[[影]]、水にうつりたり。',src:'宇治',t:'虎がうずくまって座っていて、様子をうかがう。その[[姿]]が、水に映っている。',a:'姿'},
  {w:'おもかげ',s:'母<ruby>御息所<rt>みやすどころ</rt></ruby>も、[[影]]だにおぼえ給はぬを、',src:'源氏',t:'（源氏は）母である御息所のことも、[[面影]]さえ覚えていらっしゃらないが、',a:'面影'},
  // つとめて
  {w:'つとめて',s:'十五日の[[つとめて]]は、深草の法華堂に参りたるに、',src:'とはず',t:'十五日の[[早朝]]は、深草の法華堂にお参りしたところ、',a:'早朝'},

  {w:'けしき',s:'帝の御[[けしき]]悪しくして、「さては臣が所為か。」と仰せられければ',src:'十訓',t:'帝の[[ご機嫌]]が悪くて、「さてはお前の仕業か。」とおっしゃったので、',a:'ご機嫌'},
  {w:'けしき',s:'新大納言、[[けしき]]変はりて、さと立たれけるが、',src:'平家',t:'新大納言は、[[顔色]]が変わって、さっと立たれたが、',a:'顔色'},
  // せうそこ
  {w:'せうそこ',s:'いで、御[[消息]]聞こえむ。',src:'源氏',t:'さあ、源氏の君に[[ご挨拶]]を申し上げよう。',a:'ご挨拶'},
  {w:'せうそこ',s:'「今日のうちに必ず来たれ。」といふ[[消息]]を書きて、',src:'今昔',t:'「今日中に必ず来い。」という[[手紙]]を書いて、',a:'手紙'},

  {w:'あいぎょう',s:'うち笑み給へる御[[愛敬]]、所せきまでこぼれぬべし。',src:'源氏',t:'ふと笑いなさっている[[おかわいらしさ]]が、あたりいっぱいにこぼれてしまいそうだ。',a:'おかわいらしさ'},

// State
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let streak = 0;
let maxStreak = 0;
let wrongAnswers = [];
let sessionWrong = [];
let mode = 'casual';

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function parseSentence(text){
  return text.replace(/\[\[(.+?)\]\]/g,'<u>$1</u>');
}
function parseTranslation(text){
  return text.replace(/\[\[(.+?)\]\]/g,'<span class="ans-highlight">$1</span>');
}

function getDistractors(correctAnswer, count){
  const pool = [...new Set(Q.map(q=>q.a))].filter(a=>a!==correctAnswer);
  return shuffle(pool).slice(0,count);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showTitle(){
  const wc = wrongAnswers.length;
  const btn = document.getElementById('btn-wrong');
  const lbl = document.getElementById('wrong-count-label');
  if(wc>0){
    btn.disabled=false;
    lbl.textContent=wc+'問の間違いを復習しよう！';
  } else {
    btn.disabled=true;
    lbl.textContent='まだ間違いがありません';
  }
  showScreen('s-title');
}

function startQuiz(m){
  mode = m;
  score = 0; streak = 0; maxStreak = 0; sessionWrong = [];
  currentIndex = 0;

  if(m==='casual'){
    currentQuestions = shuffle(Q).slice(0,15);
  } else if(m==='all'){
    currentQuestions = shuffle(Q);
  } else {
    if(wrongAnswers.length===0){alert('間違えた問題がありません！');return;}
    currentQuestions = shuffle(wrongAnswers);
  }
  showScreen('s-quiz');
  showQuestion();
}

function showQuestion(){
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;

  document.getElementById('q-counter').textContent = (currentIndex+1)+' / '+total;
  document.getElementById('score-disp').textContent = score;
  document.getElementById('streak-disp').textContent = streak>=3 ? '🔥'+streak+'連続！' : '';
  document.getElementById('progress-fill').style.width = ((currentIndex/total)*100)+'%';
  document.getElementById('q-sentence').innerHTML = parseSentence(q.s);
  document.getElementById('q-source').textContent = '〈'+q.src+'〉';

  // Choices
  const distractors = getDistractors(q.a, 3);
  const choices = shuffle([q.a, ...distractors]);
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = ()=>answer(c, q.a, btn);
    container.appendChild(btn);
  });
}

function answer(chosen, correct, btn){
  const isCorrect = chosen === correct;
  const allBtns = document.querySelectorAll('.choice-btn');

  allBtns.forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent===correct) b.classList.add('show-correct');
  });

  if(isCorrect){
    btn.classList.remove('disabled');
    btn.classList.add('correct');
    score += 10 + Math.min(streak*2,20);
    streak++;
    maxStreak = Math.max(maxStreak,streak);
  } else {
    btn.classList.remove('disabled');
    btn.classList.add('wrong');
    streak = 0;
    const q = currentQuestions[currentIndex];
    if(!sessionWrong.find(x=>x.s===q.s)) sessionWrong.push(q);
    // Add to wrongAnswers pool
    if(!wrongAnswers.find(x=>x.s===q.s)) wrongAnswers.push(q);
  }

  setTimeout(()=>showAnswer(isCorrect), 600);
}

function showAnswer(isCorrect){
  const q = currentQuestions[currentIndex];
  document.getElementById('ans-badge').textContent = isCorrect ? '⭕' : '❌';
  const rt = document.getElementById('ans-result-text');
  rt.textContent = isCorrect ? '正解！✨' : '不正解…正解は「'+q.a+'」';
  rt.className = 'result-text '+(isCorrect?'ok':'ng');
  document.getElementById('ans-sentence').innerHTML = parseSentence(q.s)+'<br><small style="color:#A0714F">〈'+q.src+'〉</small>';
  document.getElementById('ans-translation').innerHTML = parseTranslation(q.t);

  const isLast = currentIndex >= currentQuestions.length-1;
  document.getElementById('next-btn').textContent = isLast ? '結果を見る 🏆' : '次の問題 →';
  showScreen('s-answer');
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= currentQuestions.length){
    showResult();
  } else {
    showScreen('s-quiz');
    showQuestion();
  }
}

function showResult(){
  const total = currentQuestions.length;
  const correct = total - sessionWrong.length;
  const pct = Math.round((correct/total)*100);

  document.getElementById('final-score').textContent = score+'点';
  const msgs = ['もう一回！💪','惜しい！😤','いい感じ！👍','すごい！🌟','完璧！🎉'];
  document.getElementById('final-msg').textContent = msgs[Math.floor(pct/21)] || '完璧！🎉';
  document.getElementById('res-correct').textContent = correct+' / '+total;
  document.getElementById('res-wrong').textContent = sessionWrong.length+' 問';
  document.getElementById('res-streak').textContent = maxStreak+' 連続';

  const rwb = document.getElementById('res-wrong-btn');
  if(sessionWrong.length>0){
    rwb.style.display='block';
    rwb.textContent='❌ 間違い直しをする（'+sessionWrong.length+'問）';
  } else {
    rwb.style.display='none';
  }

  showScreen('s-result');
}

// Init
showTitle();
</script>
